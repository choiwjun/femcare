<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FemCare - Splash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #F7C8C0 0%, #F5EEE8 100%);
            color: #FFFFFF;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-container {
            max-width: 420px;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo-container {
            animation: fadeInScale 1s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .logo {
            font-size: 64px;
            margin-bottom: 16px;
            text-align: center;
        }

        .app-name {
            font-size: 42px;
            font-weight: 700;
            color: #FFFFFF;
            text-align: center;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 16px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        .loading-container {
            position: absolute;
            bottom: 100px;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .loading-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.6);
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .loading-text {
            margin-top: 16px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="logo-container">
            <div class="logo">🌸</div>
            <h1 class="app-name">FemCare</h1>
            <p class="tagline">나를 위한 건강 파트너</p>
        </div>

        <div class="loading-container">
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <p class="loading-text">로딩 중...</p>
        </div>
    </div>

    <script>
        // 2초 후 온보딩 화면으로 자동 이동
        setTimeout(() => {
            window.location.href = 'onboarding1.html';
        }, 2000);
    </script>
</body>
</html>
